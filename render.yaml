services:
  - type: web
    name: feranmi-mcp
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python cloud_relay.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SITE_TOKEN
        generateValue: true
      - key: ROBLOX_API_KEY
        sync: false
      - key: ROBLOX_UNIVERSE_ID
        sync: false
      - key: ROBLOX_PLACE_ID
        sync: false
